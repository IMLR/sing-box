name: AX3600 Router Core

on:
  workflow_dispatch:
  push:
    branches:
      - ax3600-splice
      - codex/ax3600-1.14.2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Build linux/arm64 router core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORE_VERSION: 1.14.2-reF1nd-ax3600-hyfix1
      CORE_TAGS: with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.26.8
          cache: true

      - name: Test patched splice implementation
        run: cd third_party/sing && go test ./common/bufio

      - name: Test port hopping receive recovery
        run: go test -race -tags "$CORE_TAGS" -ldflags "$(cat release/LDFLAGS)" -count=1 -timeout=60s ./.github/tests/ax3600

      - name: Build validation core
        env:
          CGO_ENABLED: 0
        run: |
          go build -trimpath -tags "$CORE_TAGS" \
            -ldflags "$(cat release/LDFLAGS) -X github.com/sagernet/sing-box/constant.Version=$CORE_VERSION -s -w -buildid=" \
            -o sing-box-linux-amd64 ./cmd/sing-box
          ./sing-box-linux-amd64 version

      - name: Test Hysteria2, Gecko, port hopping and reconnect
        run: python3 .github/tests/ax3600/hysteria_smoke.py ./sing-box-linux-amd64

      - name: Build sing-box
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath \
            -tags "$CORE_TAGS" \
            -ldflags "$(cat release/LDFLAGS) -X github.com/sagernet/sing-box/constant.Version=$CORE_VERSION -s -w -buildid=" \
            -o sing-box-linux-arm64 ./cmd/sing-box

      - name: Compress with UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends upx-ucl
          upx --best --lzma -o CrashCore.upx sing-box-linux-arm64
          upx -t CrashCore.upx

      - name: Record build provenance
        run: |
          git rev-parse HEAD > BUILD_INFO
          go version -m sing-box-linux-arm64 >> BUILD_INFO
          git diff --exit-code -- go.mod go.sum third_party/sing

      - name: Checksums
        run: |
          sha256sum CrashCore.upx sing-box-linux-arm64 sing-box-linux-amd64 | tee SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrashCore-linux-arm64
          path: |
            CrashCore.upx
            sing-box-linux-arm64
            sing-box-linux-amd64
            SHA256SUMS
            BUILD_INFO
          retention-days: 30
